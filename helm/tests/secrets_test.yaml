suite: test secrets configuration
templates:
  - secrets.yaml
tests:
  - it: should not render a secret when servingEngineSpec.enableEngine is false
    set:
      servingEngineSpec:
        enableEngine: false
        vllmApiKey: "sk-test"
    asserts:
    - hasDocuments:
        count: 0

  - it: should store a plain vllmApiKey and per model hf tokens
    release:
      name: vllm
    set:
      servingEngineSpec:
        enableEngine: true
        vllmApiKey: "sk-test"
        modelSpec:
        - name: "opt125m"
          hf_token: "hf_abc"
        - name: "llama3"
    asserts:
    - isKind:
        of: Secret
    - equal:
        path: metadata.name
        value: vllm-secrets
    - equal:
        path: data.vllmApiKey
        value: c2stdGVzdA==
    - equal:
        path: data.hf_token_opt125m
        value: aGZfYWJj
    - notExists:
        path: data.hf_token_llama3

  - it: should not store keys that reference an existing secret
    set:
      servingEngineSpec:
        enableEngine: true
        vllmApiKey:
          secretName: my-secret
          secretKey: api-key
        modelSpec:
        - name: "opt125m"
          hf_token:
            secretName: my-secret
            secretKey: hf-token
    asserts:
    - notExists:
        path: data.vllmApiKey
    - notExists:
        path: data.hf_token_opt125m

  - it: should store plain lora adapter credentials
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec: []
      loraAdapters:
      - name: "sql-adapter"
        baseModel: "llama3"
        adapterSource:
          type: "huggingface"
          adapterName: "sql"
          repository: "example/sql-lora"
          credentials: "hf_xyz"
    asserts:
    - equal:
        path: data.lora_adapter_credentials_sql
        value: aGZfeHl6
