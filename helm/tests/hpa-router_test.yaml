suite: test router HPA configuration
templates:
  - hpa-router.yaml
tests:
  - it: should not render an HPA by default
    asserts:
    - hasDocuments:
        count: 0

  - it: should render an HPA targeting the router deployment when autoscaling is enabled
    release:
      name: vllm
    set:
      routerSpec:
        enableRouter: true
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 70
    asserts:
    - hasDocuments:
        count: 1
    - isKind:
        of: HorizontalPodAutoscaler
    - equal:
        path: spec.scaleTargetRef.name
        value: vllm-deployment-router
    - equal:
        path: spec.minReplicas
        value: 2
    - equal:
        path: spec.maxReplicas
        value: 5
    - equal:
        path: spec.metrics[0].resource.target.averageUtilization
        value: 70

  - it: should not render an HPA when the router is disabled
    set:
      routerSpec:
        enableRouter: false
        autoscaling:
          enabled: true
    asserts:
    - hasDocuments:
        count: 0
