suite: test cache server service configuration
templates:
  - service-cache-server.yaml
tests:
  - it: should not render a service by default
    asserts:
    - hasDocuments:
        count: 0

  - it: should render the cache server service when enabled
    release:
      name: vllm
    set:
      cacheserverSpec:
        enabled: true
        servicePort: 81
        containerPort: 8080
    asserts:
    - hasDocuments:
        count: 1
    - isKind:
        of: Service
    - equal:
        path: metadata.name
        value: vllm-cache-server-service
    - equal:
        path: spec.type
        value: ClusterIP
    - equal:
        path: spec.ports[0]
        value:
          name: cacheserver-sport
          port: 81
          targetPort: 8080
          protocol: TCP
    - notExists:
        path: metadata.annotations

  - it: should set service type and annotations
    set:
      cacheserverSpec:
        enabled: true
        serviceType: LoadBalancer
        serviceAnnotations:
          example.com/owner: "team-a"
    asserts:
    - equal:
        path: spec.type
        value: LoadBalancer
    - equal:
        path: metadata.annotations["example.com/owner"]
        value: team-a
