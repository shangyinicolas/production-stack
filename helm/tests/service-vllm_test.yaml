suite: test per model engine service configuration
templates:
  - service-vllm.yaml
tests:
  - it: should not render a service when servingEngineSpec.enableEngine is false
    set:
      servingEngineSpec:
        enableEngine: false
    asserts:
    - hasDocuments:
        count: 0

  - it: should render one service per model
    release:
      name: vllm
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "opt125m"
        - name: "llama3"
    asserts:
    - hasDocuments:
        count: 2
    - documentIndex: 0
      equal:
        path: metadata.name
        value: vllm-opt125m-engine-service
    - documentIndex: 1
      equal:
        path: metadata.name
        value: vllm-llama3-engine-service
    - documentIndex: 0
      equal:
        path: spec.selector.model
        value: opt125m

  - it: should not render a service for a disabled model
    release:
      name: vllm
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "opt125m"
          enabled: false
        - name: "llama3"
    asserts:
    - hasDocuments:
        count: 1
    - equal:
        path: metadata.name
        value: vllm-llama3-engine-service
