suite: test values schema validation for model specs
templates:
  - deployment-vllm-multi.yaml
tests:
  - it: should accept a fractional cpu request as a number
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "opt125m"
          repository: "vllm/vllm-openai"
          tag: "latest"
          modelURL: "facebook/opt-125m"
          replicaCount: 1
          requestCPU: 0.5
          requestMemory: "4Gi"
          requestGPU: 1
    asserts:
    - equal:
        path: spec.template.spec.containers[0].resources.requests.cpu
        value: "0.5"

  - it: should accept a millicore cpu request as a string
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "opt125m"
          repository: "vllm/vllm-openai"
          tag: "latest"
          modelURL: "facebook/opt-125m"
          replicaCount: 1
          requestCPU: "500m"
          requestMemory: "4Gi"
          requestGPU: 1
    asserts:
    - equal:
        path: spec.template.spec.containers[0].resources.requests.cpu
        value: "500m"

  - it: should accept HAMi GPU values as integers
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "opt125m"
          repository: "vllm/vllm-openai"
          tag: "latest"
          modelURL: "facebook/opt-125m"
          replicaCount: 1
          requestCPU: 1
          requestMemory: "4Gi"
          requestGPU: 1
          requestGPUCores: 30
          requestGPUMem: 3000
    asserts:
    - equal:
        path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpucores"]
        value: "30"
    - equal:
        path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpumem"]
        value: "3000"

  - it: should reject a non-numeric replica count
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "opt125m"
          repository: "vllm/vllm-openai"
          tag: "latest"
          modelURL: "facebook/opt-125m"
          replicaCount: "two"
          requestCPU: 1
          requestMemory: "4Gi"
          requestGPU: 1
    asserts:
    - failedTemplate: {}
